            <p><strong>Ahora son las:</strong> <span id="hora-actual"></span></p>
            <p id="proximo-envivo-info"></p>
        </div>

        <div class="youtube-player-container">
            <iframe id="youtube-embed"
                        width="100%"
                        height="100%"
                        src="https://www.youtube.com/watch?v=Ifp9JBcHwjA" frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; live"
                        allowfullscreen>

        <div class="cronograma-envivos-container">
            <h2>Próximos <span>En Vivos</span></h2>
            <div class="proximos-envivos-list" id="proximos-envivos-list">
            </div>
        </div>

        <div class="admin-link">
            <p><a href="#">Panel de Administrador</a></p>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const introScreen = document.getElementById('introScreen');
            const mainContent = document.getElementById('mainContent');

            setTimeout(function() {
                introScreen.classList.add('fade-out');
                setTimeout(function() {
                    introScreen.style.display = 'none'; // Ocultar completamente después de la transición
                    mainContent.style.display = 'block'; // Asegurarse de que se muestre el contenido
                    setTimeout(function() {
                        mainContent.classList.add('visible'); // Iniciar la transición de opacidad
                    }, 50); // Un pequeño delay para asegurar la transición
                }, 1000); // Duración de la transición de fade-out
            }, 5000); // Duración de la pantalla de inicio
        });

        function toggleMenu() {
            var menu = document.getElementById('menuDropdown');
            menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
        }

        const proximosEnVivos = [
            {
                titulo: "Concierto de Rock en Vivo",
                fecha: "2025-05-15",
                hora: "17:30",
                duracion: "2h 00m",
                link: "#"
            },
            {
                titulo: "Charla sobre Astronomía",
                fecha: "2025-05-15",
                hora: "20:00",
                duracion: "1h 30m",
                link: "#"
            },
            {
                titulo: "Sesión de DJ en Directo",
                fecha: "2025-05-16",
                hora: "21:00",
                duracion: "3h 00m",
                link: "#"
            },
            {
                titulo: "Entrevista con Actor Famoso",
                fecha: "2025-05-17",
                hora: "19:00",
                duracion: "1h 00m",
                link: "#"
            },
        ];

        function mostrarHoraAmPm(hora24) {
            const [horas, minutos] = hora24.split(':');
            let horas12 = parseInt(horas);
            const periodo = horas12 >= 12 ? 'PM' : 'AM';
            horas12 = horas12 % 12;
            horas12 = horas12 ? horas12 : 12;
            return `${horas12}:${minutos} ${periodo}`;
        }

        function formatearFecha(fecha) {
            const partes = fecha.split('-');
            return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        function calcularFinEnVivo(horaInicio, duracion) {
            const [horasInicio, minutosInicio] = horaInicio.split(':');
            const [horasDuracion, minutosDuracion] = duracion.replace('h ', ':').replace('m', '').split(':');

            let finHoras = parseInt(horasInicio) + parseInt(horasDuracion);
            let finMinutos = parseInt(minutosInicio) + parseInt(minutosDuracion);

            if (finMinutos >= 60) {
                finHoras += Math.floor(finMinutos / 60);
                finMinutos %= 60;
            }

            return `${String(finHoras).padStart(2, '0')}:${String(finMinutos).padStart(2, '0')}`;
        }

        function actualizarHoraActual() {
            const ahora = new Date();
            const horas = String(ahora.getHours()).padStart(2, '0');
            const minutos = String(ahora.getMinutes()).padStart(2, '0');
            document.getElementById('hora-actual').textContent = mostrarHoraAmPm(`${horas}:${minutos}`);
        }

        function mostrarProximoEnVivoInfo(proximoEnVivo) {
            const proximoEnVivoInfoElement = document.getElementById('proximo-envivo-info');
            if (proximoEnVivo) {
                proximoEnVivoInfoElement.textContent = `Próximo en vivo: ${proximoEnVivo.titulo} - ${formatearFecha(proximoEnVivo.fecha)} ${mostrarHoraAmPm(proximoEnVivo.hora)}`;
            } else {
                proximoEnVivoInfoElement.textContent = '';
            }
        }

        function mostrarProximosEnVivos(envivos) {
            const listaEnVivos = document.getElementById('proximos-envivos-list');
            listaEnVivos.innerHTML = '';

            const ahora = new Date();
            const diaActual = `${ahora.getFullYear()}-${String(ahora.getMonth() + 1).padStart(2, '0')}-${String(ahora.getDate()).padStart(2, '0')}`;
            const horaActual24 = `${String(ahora.getHours()).padStart(2, '0')}:${String(ahora.getMinutes()).padStart(2, '0')}`;

            let enVivoAhora = null;
            let proximoEnVivo = null;
            let proximosOrdenados = [];

            envivos.forEach(envivo => {
                if (envivo.fecha === diaActual) {
                    const finEnVivo = calcularFinEnVivo(envivo.hora, envivo.duracion);
                    if (horaActual24 >= envivo.hora && horaActual24 < finEnVivo) {
                        enVivoAhora = envivo;
                    } else if (envivo.hora > horaActual24) {
                        proximosOrdenados.push(envivo);
                    }
                } else if (envivo.fecha > diaActual) {
                    proximosOrdenados.push(envivo);
                }
            });

            proximosOrdenados.sort((a, b) => {
                if (a.fecha !== b.fecha) {
                    return a.fecha.localeCompare(b.fecha);
                }
                return a.hora.localeCompare(b.hora);
            });

            // Mostrar título de "EN VIVO" si hay un evento actual
            const youtubePlayerContainer = document.querySelector('.youtube-player-container');
            const enVivoTitulo = document.getElementById('en-vivo-titulo');
            if (enVivoAhora) {
                if (!enVivoTitulo) {
                    const h2EnVivo = document.createElement('h2');
                    h2EnVivo.textContent = '🔴 EN VIVO';
                    h2EnVivo.style.color = '#ff0000';
                    h2EnVivo.style.textAlign = 'center';
                    h2EnVivo.style.marginBottom = '20px';
                    h2EnVivo.id = 'en-vivo-titulo';
                    youtubePlayerContainer.parentNode.insertBefore(h2EnVivo, youtubePlayerContainer);
                }
                const envivoDiv = document.createElement('div');
                envivoDiv.classList.add('envivo-item');
                envivoDiv.innerHTML = `
                    <h3>${enVivoAhora.titulo} <span style="color: #ff0000; font-weight: bold;">(EN VIVO)</span></h3>
                    <p><strong>Estado:</strong> <span style="color: #00ff00;">En vivo ahora</span></p>
                    <p><strong>Finaliza a las:</strong> ${mostrarHoraAmPm(calcularFinEnVivo(enVivoAhora.hora, enVivoAhora.duracion))}</p>
                    <p><strong>Duración:</strong> ${enVivoAhora.duracion}</p>
                    <a href="${enVivoAhora.link}" style="display: block; text-decoration: none; color: inherit;"></a>
                `;
                listaEnVivos.appendChild(envivoDiv);

                const [horasDuracion, minutosDuracion] = enVivoAhora.duracion.replace('h ', ':').replace('m', '').split(':');
                const duracionEnMilisegundos = (parseInt(horasDuracion) * 60 + parseInt(minutosDuracion)) * 60 * 1000;

                setTimeout(() => {
                    // Eliminar el título de "EN VIVO" si ya no hay evento actual
                    const nuevoEnVivoAhora = envivos.find(envivo => {
                        if (envivo.fecha === diaActual) {
                            const fin = calcularFinEnVivo(envivo.hora, envivo.duracion);
                            return horaActual24 >= envivo.hora && horaActual24 < fin;
                        }
                        return false;
                    });
                    if (!nuevoEnVivoAhora && enVivoTitulo) {
                        enVivoTitulo.remove();
                    }
                    mostrarProximosEnVivos(proximosEnVivos);
                }, duracionEnMilisegundos);

            } else {
                // Asegurarse de que el título de "EN VIVO" no esté presente
                const enVivoTituloExistente = document.getElementById('en-vivo-titulo');
                if (enVivoTituloExistente) {
                    enVivoTituloExistente.remove();
                }

                if (proximosOrdenados.length > 0) {
                    proximoEnVivo = proximosOrdenados[0];
                    const proximoEnVivoDiv = document.createElement('div');
                    proximoEnVivoDiv.classList.add('proximo-envivo-anuncio');
                    proximoEnVivoDiv.innerHTML = `
                        <p style="text-align: center; font-size: 1.1rem; color: #00bfff; margin-bottom: 10px;"><strong>Próximo en vivo:</strong> ${proximoEnVivo.titulo}</p>
                        <p style="text-align: center; font-size: 1rem; color: #ddd;"><strong>Fecha:</strong> ${formatearFecha(proximoEnVivo.fecha)}</p>
                        <p style="text-align: center; font-size: 1rem; color: #ddd;"><strong>Hora:</strong> ${mostrarHoraAmPm(proximoEnVivo.hora)}</p>
                    `;
                    listaEnVivos.appendChild(proximoEnVivoDiv);

                    proximosOrdenados.forEach(envivo => {
                        const envivoDiv = document.createElement('div');
                        envivoDiv.classList.add('envivo-item');
                        const estaEnVivoProximamente = envivo.fecha === diaActual && horaActual24 < envivo.hora;
                        envivoDiv.innerHTML = `
                            <h3>${envivo.titulo} ${estaEnVivoProximamente ? '' : ''}</h3>
                            <p><strong>Fecha:</strong> ${formatearFecha(envivo.fecha)}</p>
                            <p><strong>Hora:</strong> ${mostrarHoraAmPm(envivo.hora)}</p>
                            <p><strong>Duración:</strong> ${envivo.duracion}</p>
                            <a href="${envivo.link}" style="display: block; text-decoration: none; color: inherit;"></a>
                        `;
                        listaEnVivos.appendChild(envivoDiv);
                    });

                } else {
                    const mensajeDiv = document.createElement('div');
                    mensajeDiv.innerHTML = `<p style="text-align: center;">No hay próximos en vivos programados.</p>`;
                    listaEnVivos.appendChild(mensajeDiv);
                }
            }

            mostrarProximoEnVivoInfo(enVivoAhora || proximoEnVivo);
        }

        function buscarPelicula() {
            const inputBusqueda = document.getElementById('search');
            const textoBusqueda = inputBusqueda.value.toLowerCase();
            const envivosFiltrados = proximosEnVivos.filter(envivo =>
                envivo.titulo.toLowerCase().includes(textoBusqueda)
            );
            mostrarProximosEnVivos(envivosFiltrados);
        }

        setInterval(actualizarHoraActual, 1000);
        mostrarProximosEnVivos(proximosEnVivos);

        // El código relacionado con el botón de silencio ha sido removido
    </script>
